name: Reset demo data

# Manual only. Recreates the demo course and accounts in production.
# Safe to re-run: it deletes and recreates rows owned by the demo users only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-demo
  cancel-in-progress: false

jobs:
  seed:
    name: Reset demo data (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Reset demo data
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
